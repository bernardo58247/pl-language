name: Release Linux Executable

on:
  push:
    branches: [ main ]
    paths:
      # roda SÓ quando houver alteração neste arquivo específico
      - 'src/ppl.cpp'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: baixar o código
        uses: actions/checkout@v4

      - name: compilar c++ no linux (g++)
        run: |
          mkdir -p build
          g++ -O3 -std=c++17 src/ppl.cpp -o build/ppl-linux

      - name: criar / atualizar release fixa no github
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PPL Builds (Latest)"
          body: "compilação automática de alta performance para linux/windows gerada a partir das últimas alterações no `ppl.cpp`."
          draft: false
          prerelease: false
          files: build/ppl-linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
